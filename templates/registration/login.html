{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="col-md-5 mx-auto">
    <h2 class="mb-3">Вход</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Войти</button>
    </form>
    <p class="mt-3">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
</div>
{% endblock %}
